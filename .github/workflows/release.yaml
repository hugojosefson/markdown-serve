name: markdown-serve release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish
        required: true
        type: string

concurrency:
  group: markdown-serve-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.sha }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - run: deno task test
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.sha }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - run: deno fmt --check
      - run: deno lint
      - run: deno check
      - run: deno task readme && git diff --exit-code -- README.md
      - run: deno publish --dry-run

  release:
    runs-on: ubuntu-latest
    needs: [test, check]
    if: github.event_name == 'push' && github.actor != format('{0}[bot]', vars.RELEASE_APP_SLUG)

    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}

    permissions:
      contents: read

    steps:
      - name: Mint release App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Configure release App identity
        run: |
          git config user.name "${{ vars.RELEASE_APP_SLUG }}[bot]"
          git config user.email "${{ vars.RELEASE_APP_USER_ID }}+${{ vars.RELEASE_APP_SLUG }}[bot]@users.noreply.github.com"
      - name: Create and push the release version
        id: release
        run: |
          deno task release:run
          echo "release_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  publish:
    runs-on: ubuntu-latest
    needs: [test, check, release]
    if: github.event_name == 'push' && github.actor != format('{0}[bot]', vars.RELEASE_APP_SLUG)

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.release_sha }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - name: Publish the release version
        run: deno publish

  publish-existing:
    runs-on: ubuntu-latest
    needs: [test, check]
    if: github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - name: Verify the existing release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
          git merge-base --is-ancestor HEAD origin/main
          version="$(jq --raw-output '.version' deno.json)"
          if [[ "${version}" != "${RELEASE_TAG}" ]]; then
            echo "Tag ${RELEASE_TAG} contains version ${version}" >&2
            exit 1
          fi
      - name: Publish the existing release version
        run: deno publish

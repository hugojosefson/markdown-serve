name: markdown-serve release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - run: deno task test
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - run: deno fmt --check
      - run: deno lint
      - run: deno check
      - run: deno task readme && git diff --exit-code -- README.md
      - run: deno publish --dry-run

  release:
    runs-on: ubuntu-latest
    needs: [test, check]
    if: github.actor != format('{0}[bot]', vars.RELEASE_APP_SLUG)

    permissions:
      contents: read

    steps:
      - name: Mint release App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Configure release App identity
        run: |
          git config user.name "${{ vars.RELEASE_APP_SLUG }}[bot]"
          git config user.email "${{ vars.RELEASE_APP_USER_ID }}+${{ vars.RELEASE_APP_SLUG }}[bot]@users.noreply.github.com"
      - name: Create and push the release version
        run: deno task release:run

  publish:
    runs-on: ubuntu-latest
    needs: [test, check]
    if: github.actor == format('{0}[bot]', vars.RELEASE_APP_SLUG)

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - name: Publish the release version
        run: deno publish

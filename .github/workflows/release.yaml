name: markdown-serve release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - run: deno task test
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - run: deno fmt --check
      - run: deno lint
      - run: deno check
      - run: deno task readme && git diff --exit-code -- README.md
      - run: deno publish --dry-run

  publish:
    runs-on: ubuntu-latest
    needs: [test, check]

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Publish the new version
        run: deno publish
